apiVersion: apps/v1
kind: Deployment
metadata: 
  name: client-deployment
spec: 
  replicas: 2
  selector: 
    matchLabels: 
      app: client
  template:
    metadata:
      labels: 
        app: client
    spec:
      containers: 
      - name: client
        image: pavan07989/penny-wise-client:latest
        ports: 
        - containerPort: 3000

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: server-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: server
  template: 
    metadata: 
      labels:
        app: server
    spec:
      containers:
      - name: server
        image: pavan07989/penny-wise-server:latest
        ports:
        - containerPort: 5000
        env:
        - name: NODE_ENV
          value: "production"
        - name: MONGODB_URI
          valueFrom:
            configMapKeyRef:
              name: penny-wise-config
              key: MONGODB_URI

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-deployment
spec:
  replicas: 1
  selector: 
    matchLabels:
      app: mongo
  template: 
    metadata:
      labels:
        app: mongo
    spec: 
      containers:
      - name: mongo
        image: mongo:latest
        ports: 
        - containerPort: 27017
        volumeMounts:
        - name: mongo-data
          mountPath: /data/db
      volumes:
      - name: mongo-data
        persistentVolumeClaim: 
          claimName: mongo-pvc
